[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# Deploy script writes the addresses the PWA reads.
fs_permissions = [{ access = "read-write", path = "./frontend/src/generated" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
local = "http://127.0.0.1:8545"

[lint]
exclude_lints = ["unsafe-typecast", "asm-keccak256", "mixed-case-function", "mixed-case-variable"]

[invariant]
# Kept small so `forge test` stays fast; raise for a deep soak: FOUNDRY_INVARIANT_RUNS=256 FOUNDRY_INVARIANT_DEPTH=500 forge test
runs = 48
depth = 120
fail_on_revert = false
